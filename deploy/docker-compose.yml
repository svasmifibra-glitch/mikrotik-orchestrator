version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: mikrotik_db
    restart: always
    environment:
      POSTGRES_USER: mikrotik
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mikrotik_secure_db_pass_2026}
      POSTGRES_DB: mikrotik_orchestrator
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mikrotik_backend
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://mikrotik:mikrotik_secure_db_pass_2026@postgres:5432/mikrotik_orchestrator}
      - SECRET_KEY=${SECRET_KEY:-mikrotik_super_secret_jwt_key_change_me_in_production_2026}
      - SERVER_HOST=${SERVER_HOST:-http://localhost:8080}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  nginx:
    image: nginx:alpine
    container_name: mikrotik_nginx
    restart: always
    ports:
      - "${HOST_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
